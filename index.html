<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweeter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, updateDoc, arrayUnion, arrayRemove,
  onSnapshot, query, orderBy, serverTimestamp, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ========== FIREBASE CONFIG ==========
// ここを自分のFirebaseプロジェクトの設定に変更してください
const firebaseConfig = {
  apiKey: "AIzaSyA-AfoXK81MnOxSxglADrwXRrAWqBBP0Ag",
  authDomain: "ginga-f17c1.firebaseapp.com",
  projectId: "ginga-f17c1",
  storageBucket: "ginga-f17c1.firebasestorage.app",
  messagingSenderId: "676700405698",
  appId: "1:676700405698:web:1d89870e1c9cacbb9b205b",
  measurementId: "G-48RKK47G6Q"
};
// =====================================

let currentUser = null;
let unsubscribeTweets = null;
let auth, db, provider;
let isDemo = false;
let pendingImage = null; // base64 dataUrl

try {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  provider = new GoogleAuthProvider();

  onAuthStateChanged(auth, user => {
    currentUser = user;
    updateAuthUI(user);
  });

  // Load tweets immediately (public)
  loadTweets();

} catch(e) {
  isDemo = true;
  document.getElementById('demo-banner').style.display = 'flex';
  initDemoMode();
}

// ---- AUTH ----
window.handleLogin = async () => {
  if (isDemo) { enterDemoUser(); return; }
  try {
    await signInWithPopup(auth, provider);
  } catch(e) {
    if (e.code !== 'auth/popup-closed-by-user') alert('ログイン失敗: ' + e.message);
  }
};

window.handleLogout = async () => {
  if (isDemo) { exitDemoUser(); return; }
  if (unsubscribeTweets) unsubscribeTweets();
  await signOut(auth);
};

// ---- AUTH UI ----
function updateAuthUI(user) {
  const sidebar = document.getElementById('sidebar');
  const loggedOut = document.getElementById('logged-out-sidebar');
  const loggedIn = document.getElementById('logged-in-sidebar');
  const mobileLoggedOut = document.getElementById('mobile-logged-out');
  const mobileLoggedIn = document.getElementById('mobile-logged-in');
  const composeSection = document.getElementById('compose-section');
  const composeGate = document.getElementById('compose-gate');

  if (user) {
    loggedOut.style.display = 'none';
    loggedIn.style.display = 'flex';
    mobileLoggedOut.style.display = 'none';
    mobileLoggedIn.style.display = 'flex';
    composeSection.style.display = 'block';
    composeGate.style.display = 'none';

    const initial = (user.displayName || '?')[0].toUpperCase();
    const avatarHtml = user.photoURL
      ? `<img src="${user.photoURL}" class="user-avatar-img" alt="">`
      : `<div class="user-avatar-placeholder">${initial}</div>`;

    document.getElementById('sidebar-user-avatar').innerHTML = avatarHtml;
    document.getElementById('sidebar-user-name').textContent = user.displayName || 'ユーザー';
    document.getElementById('sidebar-user-handle').textContent = '@' + (user.email || '').split('@')[0];

    document.getElementById('mobile-user-avatar').innerHTML = avatarHtml;
    renderHistory();
  } else {
    loggedOut.style.display = 'flex';
    loggedIn.style.display = 'none';
    mobileLoggedOut.style.display = 'flex';
    mobileLoggedIn.style.display = 'none';
    composeSection.style.display = 'none';
    composeGate.style.display = 'block';
    renderHistory();
  }
}

// ---- COMPOSE ----
const inputEl = document.getElementById('tweet-input');
const submitBtn = document.getElementById('tweet-submit');
const charCounter = document.getElementById('char-counter');
const charRing = document.getElementById('char-ring');

inputEl?.addEventListener('input', function() {
  const len = this.value.length;
  const remaining = 280 - len;
  charCounter.textContent = remaining <= 20 ? remaining : '';
  const pct = Math.min(len / 280, 1);
  const C = 2 * Math.PI * 10;
  charRing.style.strokeDasharray = `${pct * C} ${C}`;
  charRing.style.stroke = len > 260 ? '#f4212e' : len > 240 ? '#ffd400' : '#1d9bf0';
  updateSubmitBtn();
  // auto-resize
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 300) + 'px';
});

function updateSubmitBtn() {
  const len = inputEl?.value.length || 0;
  submitBtn.disabled = (len === 0 && !pendingImage) || len > 280;
}

inputEl?.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') postTweet();
});

submitBtn?.addEventListener('click', postTweet);

// ---- IMAGE HANDLING ----
const imageInput      = document.getElementById('image-input');
const imagePreviewWrap = document.getElementById('image-preview-wrap');
const imagePreviewImg  = document.getElementById('image-preview-img');
const imageClearBtn   = document.getElementById('image-clear-btn');
const imageAttachBtn  = document.getElementById('image-attach-btn');

imageAttachBtn?.addEventListener('click', () => imageInput?.click());
imageInput?.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 900 * 1024) {
    showToast('⚠️ 画像は900KB以下にしてください', 'error');
    imageInput.value = '';
    return;
  }
  if (!file.type.startsWith('image/')) {
    showToast('⚠️ 画像ファイルを選択してください', 'error');
    imageInput.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    pendingImage = ev.target.result;
    imagePreviewImg.src = ev.target.result;
    imagePreviewWrap.style.display = 'block';
    updateSubmitBtn();
  };
  reader.readAsDataURL(file);
});
imageClearBtn?.addEventListener('click', () => {
  pendingImage = null;
  imageInput.value = '';
  imagePreviewWrap.style.display = 'none';
  imagePreviewImg.src = '';
  updateSubmitBtn();
});

async function postTweet() {
  if (!currentUser) return;
  const text = (inputEl.value || '').trim();
  if (text.length === 0 && !pendingImage) return;
  if (text.length > 280) return;

  submitBtn.disabled = true;
  submitBtn.textContent = '送信中...';

  const imageData = pendingImage;

  if (isDemo) {
    addDemoTweet(text, imageData);
    addToHistory(text, imageData);
    resetCompose();
    submitBtn.textContent = 'ポスト';
    return;
  }

  try {
    await addDoc(collection(db, 'tweets'), {
      text,
      imageData: imageData || null,
      uid: currentUser.uid,
      displayName: currentUser.displayName || 'ユーザー',
      photoURL: currentUser.photoURL || '',
      likes: [],
      retweets: [],
      createdAt: serverTimestamp()
    });
    addToHistory(text, imageData);
    resetCompose();
  } catch(e) {
    alert('投稿に失敗しました: ' + e.message);
  }
  submitBtn.disabled = false;
  submitBtn.textContent = 'ポスト';
}

function resetCompose() {
  inputEl.value = '';
  inputEl.style.height = 'auto';
  charCounter.textContent = '';
  charRing.style.strokeDasharray = '0 62.83';
  pendingImage = null;
  document.getElementById('image-preview-wrap').style.display = 'none';
  document.getElementById('image-preview-img').src = '';
  document.getElementById('image-input').value = '';
  updateSubmitBtn();
}

// ---- LOAD TWEETS ----
function loadTweets() {
  const feed = document.getElementById('feed');
  feed.innerHTML = `<div class="feed-loading">${[0,1,2,3].map(() => `
    <div class="skeleton-tweet">
      <div class="skeleton-avatar"></div>
      <div class="skeleton-body">
        <div class="skeleton-line" style="width:40%"></div>
        <div class="skeleton-line" style="width:90%"></div>
        <div class="skeleton-line" style="width:70%"></div>
      </div>
    </div>`).join('')}</div>`;

  const q = query(collection(db, 'tweets'), orderBy('createdAt', 'desc'));
  unsubscribeTweets = onSnapshot(q, snapshot => {
    if (snapshot.empty) {
      feed.innerHTML = `<div class="empty-feed"><p>まだツイートはありません</p><span>最初の一言を投稿しましょう 🐦</span></div>`;
      return;
    }
    const tweets = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTweets(tweets, feed);
  }, err => {
    feed.innerHTML = `<div class="empty-feed"><p>読み込みエラー</p><span>${err.message}</span></div>`;
  });
}

// ---- RENDER TWEETS ----
function renderTweets(tweets, container) {
  container.innerHTML = '';
  tweets.forEach(tweet => {
    const card = createTweetCard(tweet);
    container.appendChild(card);
  });
}

function createTweetCard(tweet) {
  const div = document.createElement('article');
  div.className = 'tweet-card';
  div.dataset.id = tweet.id;

  const isLiked = tweet.likes?.includes(currentUser?.uid);
  const isRetweeted = tweet.retweets?.includes(currentUser?.uid);
  const likeCount = tweet.likes?.length || 0;
  const rtCount = tweet.retweets?.length || 0;
  const time = tweet.createdAt?.toDate ? formatTime(tweet.createdAt.toDate()) : '今';
  const isOwner = tweet.uid === currentUser?.uid;
  const initial = (tweet.displayName || '?')[0].toUpperCase();
  const handle = '@' + (tweet.displayName || 'user').toLowerCase().replace(/\s+/g, '');

  div.innerHTML = `
    <div class="tweet-avatar-col">
      ${tweet.photoURL
        ? `<img src="${tweet.photoURL}" class="tweet-avatar" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : ''}
      <div class="tweet-avatar-fallback" style="${tweet.photoURL ? 'display:none' : 'display:flex'}">${initial}</div>
    </div>
    <div class="tweet-main">
      <div class="tweet-header">
        <div class="tweet-meta">
          <span class="tweet-name">${escHtml(tweet.displayName)}</span>
          <span class="tweet-handle">${handle}</span>
          <span class="tweet-dot">·</span>
          <span class="tweet-time">${time}</span>
        </div>
        ${isOwner ? `<button class="tweet-more-btn" data-id="${tweet.id}" title="削除">
          <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg>
        </button>` : ''}
      </div>
      ${tweet.text ? `<p class="tweet-text">${escHtml(tweet.text).replace(/\n/g, '<br>')}</p>` : ''}
      ${tweet.imageData ? `<div class="tweet-image-wrap"><img class="tweet-image" src="${tweet.imageData}" alt="添付画像" loading="lazy"></div>` : ''}
      <div class="tweet-actions">
        <button class="action-btn reply-btn dummy-btn" title="返信（未実装）">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M1.75 1h20.5c.966 0 1.75.784 1.75 1.75v12.5a1.75 1.75 0 01-1.75 1.75H21l-.002 2.346a1.75 1.75 0 01-2.826 1.38L15.828 18H1.75A1.75 1.75 0 010 16.25V2.75C0 1.784.784 1 1.75 1zm0 1.5a.25.25 0 00-.25.25v13.5c0 .138.112.25.25.25h14.5c.266 0 .526.09.732.253l2.75 2.117V18.5a.75.75 0 001.5 0v-2.75a.25.25 0 00-.25-.25H22.25a.25.25 0 00-.25.25v-13.5a.25.25 0 00-.25-.25H1.75z"/></svg>
          <span>0</span>
        </button>
        <button class="action-btn rt-btn ${isRetweeted ? 'retweeted' : ''}" data-id="${tweet.id}" data-rt="${isRetweeted}" title="リポスト">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z"/></svg>
          <span class="rt-count">${rtCount || ''}</span>
        </button>
        <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" data-id="${tweet.id}" data-liked="${isLiked}" title="いいね">
          <svg class="like-icon-outline" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"/></svg>
          <svg class="like-icon-filled" viewBox="0 0 24 24" width="18" height="18" style="display:none"><path fill="currentColor" d="M20.884 13.19c-1.351 2.48-4.001 5.12-8.379 7.67l-.505.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"/></svg>
          <span class="like-count">${likeCount || ''}</span>
        </button>
        <button class="action-btn share-btn dummy-btn" title="共有（未実装）">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2.59l5.7 5.7-1.41 1.42L13 6.41V16h-2V6.41l-3.3 3.3-1.41-1.42L12 2.59zM21 15l-.02 3.51c0 1.38-1.12 2.49-2.5 2.49H5.5C4.12 21 3 19.88 3 18.5V15h2v3.5c0 .28.22.5.5.5h12.98c.28 0 .5-.22.5-.5L19 15h2z"/></svg>
        </button>
      </div>
    </div>
  `;

  // Update like icon if liked
  if (isLiked) {
    div.querySelector('.like-icon-outline').style.display = 'none';
    div.querySelector('.like-icon-filled').style.display = 'block';
  }

  // Like handler
  div.querySelector('.like-btn').addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!currentUser) { showLoginPrompt(); return; }
    const btn = div.querySelector('.like-btn');
    const liked = btn.dataset.liked === 'true';
    const id = btn.dataset.id;

    if (isDemo) {
      toggleDemoLike(btn, liked);
      return;
    }
    try {
      await updateDoc(doc(db, 'tweets', id), {
        likes: liked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid)
      });
    } catch(err) { console.error(err); }
  });

  // Retweet handler
  div.querySelector('.rt-btn')?.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!currentUser) { showLoginPrompt(); return; }
    if (isDemo) {
      const btn = div.querySelector('.rt-btn');
      const rt = btn.dataset.rt === 'true';
      btn.dataset.rt = !rt;
      btn.classList.toggle('retweeted', !rt);
      const cnt = btn.querySelector('.rt-count');
      const cur = parseInt(cnt.textContent) || 0;
      cnt.textContent = (!rt ? cur + 1 : cur - 1) || '';
      return;
    }
    const btn = div.querySelector('.rt-btn');
    const rt = btn.dataset.rt === 'true';
    try {
      await updateDoc(doc(db, 'tweets', tweet.id), {
        retweets: rt ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid)
      });
    } catch(err) { console.error(err); }
  });

  // Delete handler
  div.querySelector('.tweet-more-btn')?.addEventListener('click', async (e) => {
    e.stopPropagation();
    const menu = document.createElement('div');
    menu.className = 'context-menu';
    menu.innerHTML = `<button class="context-delete">🗑️ 削除</button>`;
    const rect = e.target.getBoundingClientRect();
    menu.style.cssText = `position:fixed;top:${rect.bottom+4}px;left:${rect.left-120}px;`;
    document.body.appendChild(menu);

    menu.querySelector('.context-delete').onclick = async () => {
      menu.remove();
      if (isDemo) { div.style.animation='fadeOut 0.3s forwards'; setTimeout(()=>div.remove(),300); return; }
      try { await deleteDoc(doc(db, 'tweets', tweet.id)); } catch(err) { alert('削除失敗'); }
    };
    setTimeout(() => document.addEventListener('click', () => menu.remove(), { once: true }), 50);
  });

  // Image lightbox
  div.querySelector('.tweet-image')?.addEventListener('click', (e) => {
    e.stopPropagation();
    openLightbox(tweet.imageData);
  });

  return div;
}

// ---- LIGHTBOX ----
window.openLightbox = function(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').style.display = 'flex';
  document.body.style.overflow = 'hidden';
};
window.closeLightbox = function() {
  document.getElementById('lightbox').style.display = 'none';
  document.body.style.overflow = '';
};
document.getElementById('lightbox')?.addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeLightbox();
});

function showLoginPrompt() {
  document.getElementById('login-modal').style.display = 'flex';
}

// ---- TOAST ----
function showToast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'error' ? ' toast-error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('toast-show'));
  setTimeout(() => { t.classList.remove('toast-show'); setTimeout(() => t.remove(), 300); }, 2500);
}

// ---- POST HISTORY ----
let myPostHistory = [];
function addToHistory(text, imageData) {
  myPostHistory.unshift({ text, hasImage: !!imageData, time: new Date() });
  if (myPostHistory.length > 20) myPostHistory = myPostHistory.slice(0, 20);
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (!currentUser) {
    list.innerHTML = '<div class="history-empty">ログインすると履歴が表示されます</div>';
    return;
  }
  if (myPostHistory.length === 0) {
    list.innerHTML = '<div class="history-empty">まだ投稿がありません</div>';
    return;
  }
  list.innerHTML = myPostHistory.map(item => `
    <div class="history-item">
      <div class="history-text">${item.hasImage ? '🖼 ' : ''}${escHtml(item.text) || '<em style="color:var(--text-secondary)">画像のみ</em>'}</div>
      <div class="history-time">${formatTime(item.time)}</div>
    </div>
  `).join('');
}

window.closeLoginModal = () => {
  document.getElementById('login-modal').style.display = 'none';
};

// ---- DEMO MODE ----
const demoTweets = [
  { id: 'd1', displayName: '田中 葵', photoURL: '', text: 'おはようございます！今日も一日頑張りましょう ☀️\n#朝活 #エンジニア', likes: ['u1','u2','u3'], retweets: ['u1'], createdAt: null, uid: 'other' },
  { id: 'd2', displayName: 'Hana Dev', photoURL: '', text: 'FirebaseとReactの組み合わせ、最高すぎる。リアルタイム更新が本当に簡単に実装できた🔥', likes: ['u1','u2','u3','u4'], retweets: [], createdAt: null, uid: 'other' },
  { id: 'd3', displayName: '鈴木 太郎', photoURL: '', text: 'このTwitterクローン、UIがめちゃくちゃ良くないですか…？誰が作ったんだろう', likes: ['u1','u2'], retweets: ['u1','u2','u3'], createdAt: null, uid: 'other' },
  { id: 'd4', displayName: 'Yuki_codes', photoURL: '', text: 'TypeScript + Vite + Firebase = 最強の開発体験\n\n誰か異論ある？', likes: ['u1'], retweets: [], createdAt: null, uid: 'other' },
];

function initDemoMode() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  demoTweets.forEach(t => feed.appendChild(createTweetCard(t)));

  // public visible, no auth needed
  updateAuthUI(null);

  document.querySelectorAll('.compose-gate-login').forEach(btn => {
    btn.addEventListener('click', () => document.getElementById('login-modal').style.display = 'flex');
  });
}

function enterDemoUser() {
  currentUser = { uid: 'demo-me', displayName: 'あなた', photoURL: '', email: 'demo@example.com' };
  document.getElementById('login-modal').style.display = 'none';
  updateAuthUI(currentUser);
  renderHistory();
  // Re-render with auth context
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  demoTweets.forEach(t => feed.appendChild(createTweetCard(t)));
}

function exitDemoUser() {
  currentUser = null;
  updateAuthUI(null);
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  demoTweets.forEach(t => feed.appendChild(createTweetCard(t)));
}

function addDemoTweet(text, imageData) {
  const tweet = {
    id: 'new-' + Date.now(),
    displayName: currentUser.displayName,
    photoURL: currentUser.photoURL,
    text,
    imageData: imageData || null,
    likes: [],
    retweets: [],
    createdAt: null,
    uid: currentUser.uid
  };
  const card = createTweetCard(tweet);
  card.style.animation = 'tweetIn 0.3s ease';
  document.getElementById('feed').prepend(card);
  submitBtn.disabled = false;
  submitBtn.textContent = 'ポスト';
}

function toggleDemoLike(btn, liked) {
  btn.dataset.liked = !liked;
  btn.classList.toggle('liked', !liked);
  const outline = btn.querySelector('.like-icon-outline');
  const filled = btn.querySelector('.like-icon-filled');
  outline.style.display = liked ? 'block' : 'none';
  filled.style.display = liked ? 'none' : 'block';
  const cnt = btn.querySelector('.like-count');
  const cur = parseInt(cnt.textContent) || 0;
  cnt.textContent = (!liked ? cur + 1 : Math.max(cur - 1, 0)) || '';
}

// ---- UTILS ----
function formatTime(date) {
  const diff = Date.now() - date;
  if (diff < 60000) return '今';
  if (diff < 3600000) return Math.floor(diff / 60000) + '分';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '時間';
  return date.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric' });
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

  document.getElementById('login-modal').style.display = 'flex';
});

// Expose for mobile compose bridge
window._getUser = () => currentUser;
window._setPendingImage = (v) => { pendingImage = v; };
window._triggerPost = () => {
  document.getElementById('tweet-submit').dispatchEvent(new MouseEvent('click'));
};

  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg);
  padding: 10px 20px; border-radius: 100px;
  font-size: 14px; font-weight: 600; opacity: 0;
  transition: all .3s; z-index: 3000; white-space: nowrap; pointer-events: none;
}
.toast-show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast-error { background: #f4212e; color: white; }

/* Mobile FAB */
.mobile-fab {
  display: none; position: fixed;
  bottom: max(72px, calc(56px + env(safe-area-inset-bottom)));
  right: 16px; width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); border: none; color: white;
  cursor: pointer; z-index: 110;
  align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(29,155,240,.45); transition: background .15s;
}
.mobile-fab:hover { background: var(--accent-hover); }
.mobile-fab svg { width: 26px; height: 26px; fill: white; }

/* Mobile compose modal */
#mobile-compose-modal {
  display: none; position: fixed; inset: 0; z-index: 500;
  background: var(--bg); flex-direction: column;
}
#mobile-compose-modal.open { display: flex; }
.mobile-compose-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.mobile-compose-cancel {
  background: none; border: none; color: var(--text);
  font-size: 15px; cursor: pointer; font-family: var(--font); padding: 4px 8px;
}
.mobile-compose-body { flex: 1; padding: 12px 16px; overflow-y: auto; }
.mobile-compose-inner { display: flex; gap: 12px; }
.mobile-compose-right { flex: 1; min-width: 0; }
#mobile-tweet-input {
  width: 100%; background: transparent; border: none;
  color: var(--text); font-family: var(--font); font-size: 20px;
  resize: none; min-height: 120px; outline: none;
  caret-color: var(--accent); line-height: 1.5;
}
#mobile-tweet-input::placeholder { color: var(--text-dim); }
#mobile-image-preview-wrap {
  display: none; position: relative; margin-top: 10px;
  border-radius: 14px; overflow: hidden; border: 1px solid var(--border);
}
#mobile-image-preview-img { width: 100%; max-height: 240px; object-fit: cover; display: block; }
#mobile-image-clear-btn {
  position: absolute; top: 8px; right: 8px;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(0,0,0,.75); border: none; color: white;
  font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.mobile-compose-footer {
  border-top: 1px solid var(--border); padding: 10px 16px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.mobile-compose-footer-left { display: flex; gap: 2px; }

.history-empty { color: var(--text-secondary); font-size: 14px; padding: 4px 0; }

.history-item {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}
.history-item:last-child { border-bottom: none; }
.history-item:hover .history-text { color: var(--accent); }
.history-text {
  font-size: 14px;
  color: var(--text);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  line-height: 1.5;
  margin-bottom: 2px;
}
.history-time { font-size: 12px; color: var(--text-secondary); }

/* Scrollbar */
::-webkit-scrollbar { width: 0; }
</style>
</head>

<script>
// ---- MOBILE COMPOSE ----
let mobilePendingImage = null;

function openMobileCompose() {
  if (!window._getUser?.()) { document.getElementById('login-modal').style.display = 'flex'; return; }
  document.getElementById('mobile-compose-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  const av = document.getElementById('mobile-user-avatar')?.innerHTML;
  if (av) document.getElementById('mobile-compose-avatar').innerHTML = av;
  setTimeout(() => document.getElementById('mobile-tweet-input').focus(), 150);
}
function closeMobileCompose() {
  document.getElementById('mobile-compose-modal').classList.remove('open');
  document.body.style.overflow = '';
}
function updateMobileSubmit() {
  const len = document.getElementById('mobile-tweet-input').value.length;
  const btn = document.getElementById('mobile-tweet-submit');
  const ok = (len > 0 || mobilePendingImage) && len <= 280;
  btn.disabled = !ok;
  btn.style.opacity = ok ? '1' : '0.5';
}
document.getElementById('mobile-tweet-input').addEventListener('input', function() {
  const len = this.value.length;
  const rem = 280 - len;
  const el = document.getElementById('mobile-char-counter');
  el.textContent = rem <= 30 ? rem : '';
  el.style.color = rem < 10 ? '#f4212e' : 'var(--text-dim)';
  updateMobileSubmit();
});
function handleMobileImageSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 900*1024) {
    alert('画像は900KB以下にしてください');
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    mobilePendingImage = ev.target.result;
    document.getElementById('mobile-image-preview-img').src = ev.target.result;
    document.getElementById('mobile-image-preview-wrap').style.display = 'block';
    updateMobileSubmit();
  };
  reader.readAsDataURL(file);
}
function clearMobileImage() {
  mobilePendingImage = null;
  document.getElementById('mobile-image-input').value = '';
  document.getElementById('mobile-image-preview-wrap').style.display = 'none';
  document.getElementById('mobile-image-preview-img').src = '';
  updateMobileSubmit();
}
async function postMobileTweet() {
  const input = document.getElementById('mobile-tweet-input');
  const text = input.value.trim();
  if ((text.length === 0 && !mobilePendingImage) || text.length > 280) return;
  if (!window._getUser?.()) return;

  const btn = document.getElementById('mobile-tweet-submit');
  btn.disabled = true; btn.textContent = '送信中...'; btn.style.opacity = '0.5';

  if (window._isDemo?.()) {
    window._addDemoTweet?.(text, mobilePendingImage);
    window._addToHistory?.(text, mobilePendingImage);
  } else {
    // Set values into desktop compose and trigger
    document.getElementById('tweet-input').value = text;
    window._setPendingImage?.(mobilePendingImage);
    // Show image preview in desktop compose if needed (silent)
    window._triggerPost?.();
    await new Promise(r => setTimeout(r, 800));
  }

  input.value = '';
  clearMobileImage();
  btn.textContent = 'ポスト';
