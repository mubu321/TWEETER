<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ViewTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

// ========== FIREBASE CONFIG ==========
const firebaseConfig = {
  apiKey: "AIzaSyA-AfoXK81MnOxSxglADrwXRrAWqBBP0Ag",
  authDomain: "ginga-f17c1.firebaseapp.com",
  projectId: "ginga-f17c1",
  storageBucket: "ginga-f17c1.firebasestorage.app",
  messagingSenderId: "676700405698",
  appId: "1:676700405698:web:1d89870e1c9cacbb9b205b",
  measurementId: "G-48RKK47G6Q"
};

let currentUser = null;
let auth, db, storage;
let isDemo = false;
let currentVideo = null;
let allVideos = [];

try {
  const app = initializeApp(firebaseConfig);
  auth    = getAuth(app);
  db      = getFirestore(app);
  storage = getStorage(app);
  onAuthStateChanged(auth, user => { currentUser = user; updateAuthUI(user); });
  loadVideos();
} catch(e) {
  isDemo = true;
  document.getElementById("demo-banner").style.display = "flex";
  initDemoMode();
}

// AUTH
window.handleLogin = async () => {
  if (isDemo) { enterDemoUser(); return; }
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e) { if (e.code !== "auth/popup-closed-by-user") alert("ログイン失敗: " + e.message); }
};
window.handleLogout = async () => {
  if (isDemo) { exitDemoUser(); return; }
  await signOut(auth);
};

function updateAuthUI(user) {
  const li = document.getElementById("auth-logged-in");
  const lo = document.getElementById("auth-logged-out");
  const ub = document.getElementById("upload-fab");
  if (user) {
    lo.style.display = "none"; li.style.display = "flex"; ub.style.display = "flex";
    const init = (user.displayName||"?")[0].toUpperCase();
    document.getElementById("header-avatar").innerHTML = user.photoURL
      ? `<img src="${user.photoURL}" class="h-avatar-img" alt="">`
      : `<div class="h-avatar-init">${init}</div>`;
    document.getElementById("header-name").textContent = user.displayName || "ユーザー";
  } else {
    lo.style.display = "flex"; li.style.display = "none"; ub.style.display = "none";
  }
}

// UPLOAD
const dropzone  = document.getElementById("dropzone");
const fileInput = document.getElementById("file-input");
const thumbInput= document.getElementById("thumb-input");
let selVideo = null, selThumb = null;

dropzone.addEventListener("click", () => fileInput.click());
dropzone.addEventListener("dragover",  e => { e.preventDefault(); dropzone.classList.add("drag-over"); });
dropzone.addEventListener("dragleave", () => dropzone.classList.remove("drag-over"));
dropzone.addEventListener("drop", e => {
  e.preventDefault(); dropzone.classList.remove("drag-over");
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith("video/")) setVideoFile(f);
  else showToast("動画ファイルを選択してください","error");
});
fileInput.addEventListener("change", e => { if (e.target.files[0]) setVideoFile(e.target.files[0]); });
thumbInput.addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  selThumb = f;
  const url = URL.createObjectURL(f);
  document.getElementById("thumb-preview").src = url;
  document.getElementById("thumb-preview-wrap").style.display = "block";
});

function setVideoFile(file) {
  selVideo = file;
  const mb = (file.size/1024/1024).toFixed(1);
  document.getElementById("dropzone-text").innerHTML =
    `<strong>${esc(file.name)}</strong><br><span style="color:var(--text-dim);font-size:13px">${mb} MB · クリックで変更</span>`;
  document.getElementById("dropzone-icon").textContent = "🎬";
  document.getElementById("upload-section").style.display = "block";
  generateThumb(file);
}

function generateThumb(file) {
  const v = document.createElement("video");
  v.src = URL.createObjectURL(file); v.currentTime = 1; v.muted = true;
  v.addEventListener("seeked", () => {
    const c = document.createElement("canvas");
    c.width = v.videoWidth||640; c.height = v.videoHeight||360;
    c.getContext("2d").drawImage(v,0,0);
    c.toBlob(blob => {
      if (!blob) return;
      selThumb = new File([blob],"thumb.jpg",{type:"image/jpeg"});
      document.getElementById("thumb-preview").src = URL.createObjectURL(blob);
      document.getElementById("thumb-preview-wrap").style.display = "block";
    },"image/jpeg",0.85);
    URL.revokeObjectURL(v.src);
  }); v.load();
}

document.getElementById("thumb-area").addEventListener("click", () => thumbInput.click());

document.getElementById("upload-btn").addEventListener("click", async () => {
  if (!currentUser) { openLoginModal(); return; }
  const title = document.getElementById("upload-title").value.trim();
  const desc  = document.getElementById("upload-desc").value.trim();
  if (!selVideo) { showToast("動画ファイルを選択してください","error"); return; }
  if (!title)   { showToast("タイトルを入力してください","error"); return; }

  if (isDemo) {
    addDemoVideo({ title, desc,
      videoUrl: URL.createObjectURL(selVideo),
      thumbUrl: selThumb ? URL.createObjectURL(selThumb) : "" });
    resetUpload(); showPage("home"); showToast("✓ 投稿しました！"); return;
  }

  const btn = document.getElementById("upload-btn");
  btn.disabled = true;
  const prog = document.getElementById("upload-progress-wrap");
  const bar  = document.getElementById("upload-progress-bar");
  const pct  = document.getElementById("upload-progress-pct");
  prog.style.display = "block";

  try {
    const uid = currentUser.uid, ts = Date.now();
    const vRef = ref(storage, `videos/${uid}/${ts}_${selVideo.name}`);
    const task = uploadBytesResumable(vRef, selVideo);
    task.on("state_changed",
      s => { const p = Math.round(s.bytesTransferred/s.totalBytes*90); bar.style.width=p+"%"; pct.textContent=p+"%"; },
      err => { showToast("アップロード失敗: "+err.message,"error"); btn.disabled=false; prog.style.display="none"; },
      async () => {
        const videoUrl = await getDownloadURL(task.snapshot.ref);
        let thumbUrl = "";
        if (selThumb) {
          const tr = ref(storage,`thumbs/${uid}/${ts}_thumb.jpg`);
          const tt = uploadBytesResumable(tr, selThumb);
          await new Promise((res,rej)=>tt.on("state_changed",null,rej,res));
          thumbUrl = await getDownloadURL(tt.snapshot.ref);
        }
        bar.style.width="100%"; pct.textContent="100%";
        await addDoc(collection(db,"videos"), {
          title, desc, videoUrl, thumbUrl,
          fileName: selVideo.name, uid,
          displayName: currentUser.displayName||"ユーザー",
          photoURL: currentUser.photoURL||"",
          createdAt: serverTimestamp()
        });
        resetUpload(); showPage("home"); showToast("✓ 投稿しました！");
        btn.disabled=false; prog.style.display="none";
      }
    );
  } catch(e) { showToast("エラー: "+e.message,"error"); btn.disabled=false; prog.style.display="none"; }
});

function resetUpload() {
  selVideo=null; selThumb=null; fileInput.value=""; thumbInput.value="";
  document.getElementById("dropzone-text").textContent="動画ファイルをドラッグ＆ドロップ、またはクリックして選択";
  document.getElementById("dropzone-icon").textContent="📁";
  document.getElementById("upload-section").style.display="none";
  document.getElementById("upload-title").value="";
  document.getElementById("upload-desc").value="";
  document.getElementById("thumb-preview-wrap").style.display="none";
  document.getElementById("upload-progress-wrap").style.display="none";
  document.getElementById("upload-progress-bar").style.width="0%";
}

// PAGES
window.showPage = p => {
  ["home","upload","player"].forEach(n => {
    document.getElementById("page-"+n).style.display = n===p ? "block" : "none";
  });
  if (p !== "player") { const v=document.getElementById("main-video"); v.pause(); v.src=""; }
  window.scrollTo(0,0);
};
window.goHome = () => showPage("home");
window.openUploadPage = () => { if (!currentUser) { openLoginModal(); return; } showPage("upload"); };

// LOAD VIDEOS
function loadVideos(sq="") {
  const grid = document.getElementById("video-grid");
  grid.innerHTML = `<div class="grid-loading">${Array(8).fill("").map(()=>`
    <div class="skel-card"><div class="skel-thumb"></div>
    <div class="skel-info"><div class="skel-line" style="width:80%"></div>
    <div class="skel-line" style="width:50%"></div></div></div>`).join("")}</div>`;
  if (isDemo) { renderGrid(demoVideos, sq); return; }
  const q = query(collection(db,"videos"), orderBy("createdAt","desc"));
  onSnapshot(q, snap => {
    allVideos = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderGrid(allVideos, sq);
  }, err => {
    grid.innerHTML = `<div class="empty-state"><p>読み込みエラー</p><span>${err.message}</span></div>`;
  });
}

function renderGrid(videos, sq="") {
  if (sq) { const s=sq.toLowerCase(); videos=videos.filter(v=>v.title?.toLowerCase().includes(s)||v.displayName?.toLowerCase().includes(s)); }
  const grid = document.getElementById("video-grid");
  if (!videos.length) {
    grid.innerHTML=`<div class="empty-state"><div class="empty-icon">📺</div>
      <p>${sq?"「"+esc(sq)+"」の動画は見つかりません":"まだ動画がありません"}</p>
      <span>最初の動画を投稿してみましょう！</span></div>`; return;
  }
  grid.innerHTML="";
  videos.forEach(v => {
    const card = document.createElement("div");
    card.className="video-card";
    const time = v.createdAt?.toDate ? fmt(v.createdAt.toDate()) : "今";
    const init = (v.displayName||"?")[0].toUpperCase();
    card.innerHTML=`
      <div class="card-thumb">
        ${v.thumbUrl?`<img src="${v.thumbUrl}" alt="${esc(v.title)}" loading="lazy">`
          :`<div class="thumb-ph"><span>▶</span></div>`}
        <div class="play-ov">▶</div>
      </div>
      <div class="card-info">
        <div class="card-ch-av">
          ${v.photoURL?`<img src="${v.photoURL}" class="ch-av-img" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:``}
          <div class="ch-av-init" style="${v.photoURL?"display:none":"display:flex"}">${init}</div>
        </div>
        <div class="card-meta">
          <div class="card-title">${esc(v.title)}</div>
          <div class="card-channel">${esc(v.displayName)}</div>
          <div class="card-time">${time}</div>
        </div>
      </div>`;
    card.querySelector(".card-thumb").addEventListener("click", ()=>openPlayer(v));
    card.querySelector(".card-title").addEventListener("click", ()=>openPlayer(v));
    grid.appendChild(card);
  });
}

// PLAYER
function openPlayer(video) {
  currentVideo = video;
  showPage("player");
  const vEl = document.getElementById("main-video");
  vEl.src = video.videoUrl; vEl.load(); vEl.play().catch(()=>{});
  document.getElementById("player-title").textContent   = video.title;
  document.getElementById("player-channel").textContent = video.displayName;
  document.getElementById("player-time").textContent    = video.createdAt?.toDate ? fmt(video.createdAt.toDate()) : "今";
  document.getElementById("player-desc").textContent    = video.desc || "";
  const isOwner = video.uid === currentUser?.uid;
  const delBtn  = document.getElementById("player-delete-btn");
  delBtn.style.display = isOwner ? "inline-flex" : "none";
  delBtn.onclick = () => deleteVideo(video);
  const src = isDemo ? demoVideos : allVideos;
  const rel = document.getElementById("related-list");
  rel.innerHTML = "";
  src.filter(v=>v.id!==video.id).slice(0,8).forEach(v => {
    const d = document.createElement("div"); d.className="related-card";
    d.innerHTML=`<div class="rel-thumb">${v.thumbUrl?`<img src="${v.thumbUrl}" loading="lazy" alt="">`:`<div class="thumb-ph small"><span>▶</span></div>`}</div>
      <div class="rel-meta"><div class="rel-title">${esc(v.title)}</div><div class="rel-ch">${esc(v.displayName)}</div></div>`;
    d.addEventListener("click",()=>openPlayer(v));
    rel.appendChild(d);
  });
}

async function deleteVideo(video) {
  if (!confirm("この動画を削除しますか？")) return;
  if (isDemo) {
    const i=demoVideos.findIndex(v=>v.id===video.id); if(i>-1) demoVideos.splice(i,1);
    goHome(); renderGrid(demoVideos); return;
  }
  try {
    await deleteDoc(doc(db,"videos",video.id));
    if (video.videoUrl) try { await deleteObject(ref(storage,video.videoUrl)); } catch {}
    if (video.thumbUrl) try { await deleteObject(ref(storage,video.thumbUrl)); } catch {}
    goHome(); showToast("動画を削除しました");
  } catch(e) { showToast("削除失敗: "+e.message,"error"); }
}

// SEARCH
let searchTimer;
document.getElementById("search-input").addEventListener("input", function() {
  clearTimeout(searchTimer);
  const q=this.value.trim();
  searchTimer=setTimeout(()=>{
    if (document.getElementById("page-home").style.display!=="none") {
      if (isDemo) renderGrid(demoVideos,q); else loadVideos(q);
    }
  },280);
});

// LOGIN
function openLoginModal() { document.getElementById("login-modal").style.display="flex"; }
window.closeLoginModal = ()=>{ document.getElementById("login-modal").style.display="none"; };

// TOAST
function showToast(msg, type="success") {
  const t=document.createElement("div");
  t.className="toast"+(type==="error"?" toast-error":"");
  t.textContent=msg; document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{t.classList.remove("show"); setTimeout(()=>t.remove(),300);},3000);
}
window.showToast=showToast;

// DEMO
let demoVideos=[
  {id:"d1",title:"夕暮れの公園散歩",desc:"近所の公園を夕暮れ時に歩いた動画です。",displayName:"田中 葵",photoURL:"",
   videoUrl:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
   thumbUrl:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/images/BigBuckBunny.jpg",createdAt:null,uid:"other"},
  {id:"d2",title:"手作りラーメン — 豚骨スープから",desc:"自家製豚骨ラーメンの作り方を紹介します。",displayName:"料理チャンネル",photoURL:"",
   videoUrl:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
   thumbUrl:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/images/ElephantsDream.jpg",createdAt:null,uid:"other"},
  {id:"d3",title:"ギター練習 — コードF攻略法",desc:"初心者がつまずくFコードの練習方法を解説。",displayName:"Guitar Life",photoURL:"",
   videoUrl:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
   thumbUrl:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/images/ForBiggerBlazes.jpg",createdAt:null,uid:"other"},
  {id:"d4",title:"東京 夜景タイムラプス",desc:"東京タワー周辺の夜景を撮影しました。",displayName:"Tokyo Lens",photoURL:"",
   videoUrl:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
   thumbUrl:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/images/ForBiggerEscapes.jpg",createdAt:null,uid:"other"},
  {id:"d5",title:"初心者向けPython講座 #1",desc:"Pythonの基礎から学ぼう。",displayName:"CodeMaster JP",photoURL:"",
   videoUrl:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackOnStreetAndDirt.mp4",
   thumbUrl:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/images/SubaruOutbackOnStreetAndDirt.jpg",createdAt:null,uid:"other"},
  {id:"d6",title:"猫のいる日常 — 朝のルーティン",desc:"我が家の猫と過ごす朝のひとコマ。",displayName:"にゃんこ日記",photoURL:"",
   videoUrl:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/VolkswagenGTIReview.mp4",
   thumbUrl:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/images/VolkswagenGTIReview.jpg",createdAt:null,uid:"other"},
];

function initDemoMode() { renderGrid(demoVideos); updateAuthUI(null); }
function addDemoVideo(data) {
  demoVideos.unshift({id:"d-"+Date.now(),...data,displayName:currentUser?.displayName||"あなた",photoURL:currentUser?.photoURL||"",createdAt:null,uid:currentUser?.uid||"demo"});
  renderGrid(demoVideos);
}
function enterDemoUser() {
  currentUser={uid:"demo-me",displayName:"あなた",photoURL:"",email:"demo@example.com"};
  document.getElementById("login-modal").style.display="none"; updateAuthUI(currentUser);
}
function exitDemoUser() { currentUser=null; updateAuthUI(null); renderGrid(demoVideos); }

function fmt(d) {
  if (!d) return "今";
  const diff=Date.now()-d;
  if (diff<60000) return "今";
  if (diff<3600000) return Math.floor(diff/60000)+"分前";
  if (diff<86400000) return Math.floor(diff/3600000)+"時間前";
  if (diff<2592000000) return Math.floor(diff/86400000)+"日前";
  return d.toLocaleDateString("ja-JP",{year:"numeric",month:"short",day:"numeric"});
}
function esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surf:#212121;--surf2:#2a2a2a;--border:#3a3a3a;
  --text:#f1f1f1;--text-dim:#aaa;--red:#ff0000;--red2:#cc0000;
  --font:"Noto Sans JP",-apple-system,sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}

header{position:sticky;top:0;z-index:300;height:56px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px}
.logo{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--text);cursor:pointer;flex-shrink:0}
.logo-mark{width:32px;height:22px;background:var(--red);border-radius:5px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:16px;height:16px;fill:white}
.logo-name{font-size:17px;font-weight:900;letter-spacing:-.5px}
.logo-name em{color:var(--red);font-style:normal}
.h-search{flex:1;max-width:540px;margin:0 auto;display:flex;border:1px solid var(--border);border-radius:40px;overflow:hidden;transition:border-color .15s}
.h-search:focus-within{border-color:#1c62b9}
#search-input{flex:1;background:var(--surf);border:none;color:var(--text);font-family:var(--font);font-size:15px;padding:8px 16px;outline:none}
#search-input::placeholder{color:var(--text-dim)}
.h-search-btn{background:var(--surf2);border:none;border-left:1px solid var(--border);padding:0 18px;cursor:pointer;color:var(--text-dim);transition:background .15s}
.h-search-btn:hover{background:var(--border);color:var(--text)}
.h-search-btn svg{width:18px;height:18px;display:block}
.h-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
#upload-fab{display:none;align-items:center;gap:6px;background:var(--red);color:white;border:none;border-radius:20px;padding:7px 14px;font-size:14px;font-weight:700;font-family:var(--font);cursor:pointer;transition:background .15s;white-space:nowrap}
#upload-fab:hover{background:var(--red2)}
#upload-fab svg{width:18px;height:18px}
#auth-logged-out{display:flex}
.login-btn{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid #3ea6ff;color:#3ea6ff;border-radius:20px;padding:7px 14px;font-size:14px;font-weight:500;font-family:var(--font);cursor:pointer;transition:background .15s;white-space:nowrap}
.login-btn:hover{background:rgba(62,166,255,.1)}
#auth-logged-in{display:none;align-items:center;gap:8px}
.h-avatar-img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.h-avatar-init{width:32px;height:32px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:white}
#header-name{font-size:13px;color:var(--text-dim)}
.logout-btn{background:none;border:none;color:var(--text-dim);font-size:13px;cursor:pointer;font-family:var(--font);padding:4px 8px;border-radius:4px;transition:background .15s}
.logout-btn:hover{background:var(--surf2);color:var(--text)}

#demo-banner{display:none;background:#1a1207;border-bottom:1px solid #ff0;padding:8px 16px;font-size:13px;color:#999;align-items:center;gap:8px}
#demo-banner a{color:#ffdd00;cursor:pointer;text-decoration:underline}

#page-home{padding:24px 20px;max-width:1400px;margin:0 auto}
.home-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.home-title{font-size:20px;font-weight:700}

#video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.grid-loading{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.skel-card{}
.skel-thumb{aspect-ratio:16/9;background:var(--surf);border-radius:10px;animation:shimmer 1.5s infinite}
.skel-info{padding:10px 2px 0;display:flex;flex-direction:column;gap:8px}
.skel-line{height:13px;background:var(--surf);border-radius:4px;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%,100%{opacity:.4}50%{opacity:.9}}
.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty-icon{font-size:52px;margin-bottom:16px}
.empty-state p{font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty-state span{font-size:14px}

.video-card{cursor:pointer}
.card-thumb{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--surf)}
.card-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card-thumb:hover img{transform:scale(1.05)}
.thumb-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a1a,#333);font-size:40px;color:rgba(255,255,255,.3)}
.thumb-ph.small{font-size:22px}
.play-ov{position:absolute;inset:0;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;font-size:44px;color:white;opacity:0;transition:all .2s;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.card-thumb:hover .play-ov{opacity:1;background:rgba(0,0,0,.3)}
.card-info{display:flex;gap:10px;padding:10px 2px 0}
.card-ch-av{flex-shrink:0}
.ch-av-img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.ch-av-init{width:34px;height:34px;border-radius:50%;background:var(--red);align-items:center;justify-content:center;font-weight:700;color:white;font-size:13px}
.card-meta{flex:1;min-width:0}
.card-title{font-size:14px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.card-channel,.card-time{font-size:12px;color:var(--text-dim)}

#page-upload{display:none;max-width:760px;margin:0 auto;padding:28px 20px}
.page-back{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--text-dim);font-size:14px;cursor:pointer;font-family:var(--font);padding:0;margin-bottom:24px;transition:color .15s}
.page-back:hover{color:var(--text)}
.page-back svg{width:20px;height:20px}
.upload-page-title{font-size:22px;font-weight:700;margin-bottom:24px}

#dropzone{border:2px dashed var(--border);border-radius:12px;padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:24px}
#dropzone:hover,#dropzone.drag-over{border-color:var(--red);background:rgba(255,0,0,.04)}
#dropzone-icon{font-size:48px;margin-bottom:12px}
#dropzone-text{font-size:15px;color:var(--text-dim);line-height:1.6}
#dropzone-text strong{color:var(--text)}
.dropzone-hint{font-size:12px;color:var(--text-dim);margin-top:6px}
#upload-section{display:none}
.upload-fields{display:flex;flex-direction:column;gap:16px;margin-bottom:20px}
.field-label{display:block;font-size:13px;color:var(--text-dim);font-weight:500;margin-bottom:6px}
.field-input{width:100%;background:var(--surf);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:15px;padding:10px 14px;outline:none;transition:border-color .15s}
.field-input:focus{border-color:#3ea6ff}
.field-input::placeholder{color:var(--text-dim)}
textarea.field-input{resize:vertical;min-height:80px}

.thumb-section{margin-bottom:20px}
.thumb-section-label{font-size:14px;font-weight:600;margin-bottom:10px}
#thumb-area{width:200px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:2px dashed var(--border);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;transition:border-color .15s;background:var(--surf)}
#thumb-area:hover{border-color:var(--red)}
#thumb-preview-wrap{display:none;position:absolute;inset:0}
#thumb-preview{width:100%;height:100%;object-fit:cover}
.thumb-area-hint{font-size:12px;color:var(--text-dim);text-align:center;padding:8px;line-height:1.5}

#upload-progress-wrap{display:none;margin-bottom:16px}
.progress-label{font-size:13px;color:var(--text-dim);margin-bottom:6px;display:flex;justify-content:space-between}
.progress-track{height:6px;background:var(--surf);border-radius:3px;overflow:hidden}
#upload-progress-bar{height:100%;background:var(--red);border-radius:3px;width:0%;transition:width .3s}
#upload-btn{width:100%;padding:13px;background:var(--red);color:white;border:none;border-radius:8px;font-size:16px;font-weight:700;font-family:var(--font);cursor:pointer;transition:background .15s}
#upload-btn:hover:not(:disabled){background:var(--red2)}
#upload-btn:disabled{opacity:.5;cursor:not-allowed}

#page-player{display:none;max-width:1240px;margin:0 auto;padding:20px 16px}
.player-layout{display:grid;grid-template-columns:1fr 360px;gap:24px}
.player-wrap{background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;margin-bottom:16px}
#main-video{width:100%;height:100%;display:block;background:#000}
.player-title{font-size:20px;font-weight:700;line-height:1.3;margin-bottom:12px}
.player-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px}
.player-channel{font-size:15px;font-weight:600}
.player-time{font-size:13px;color:var(--text-dim)}
.player-btns{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surf2);border:none;color:var(--text);padding:7px 14px;border-radius:20px;font-size:13px;font-weight:500;font-family:var(--font);cursor:pointer;transition:background .15s}
.pill:hover{background:var(--border)}
.pill.danger{border:1px solid #f4212e;background:transparent;color:#f4212e}
.pill.danger:hover{background:rgba(244,33,46,.1)}
.player-desc{font-size:14px;color:var(--text-dim);line-height:1.7;white-space:pre-wrap;word-break:break-word;background:var(--surf);border-radius:10px;padding:14px}

.related-title-hd{font-size:15px;font-weight:700;margin-bottom:12px}
.related-card{display:flex;gap:8px;margin-bottom:10px;cursor:pointer;padding:8px;border-radius:8px;transition:background .15s}
.related-card:hover{background:var(--surf)}
.rel-thumb{width:130px;height:73px;border-radius:6px;overflow:hidden;flex-shrink:0;background:var(--surf)}
.rel-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rel-meta{flex:1;min-width:0}
.rel-title{font-size:13px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:3px}
.rel-ch{font-size:12px;color:var(--text-dim)}

#login-modal{display:none;position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.85);align-items:center;justify-content:center;padding:16px}
.login-box{background:#282828;border-radius:14px;padding:36px 32px;width:100%;max-width:380px;text-align:center;position:relative}
.login-logo{font-size:44px;font-weight:900;letter-spacing:-2px;margin-bottom:6px}
.login-logo em{color:var(--red);font-style:normal}
.login-sub{font-size:14px;color:var(--text-dim);margin-bottom:28px;line-height:1.6}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;background:white;color:#111;border:none;border-radius:8px;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;transition:background .15s}
.google-btn:hover{background:#eee}
.modal-x{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--text-dim);font-size:22px;cursor:pointer;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.modal-x:hover{background:var(--surf2);color:var(--text)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.toast-error{background:#f4212e;color:white}

@media(max-width:1000px){.player-layout{grid-template-columns:1fr}.related-list-wrap{display:none}}
@media(max-width:680px){
  header{padding:0 10px;gap:8px}
  .logo-name{display:none}
  #search-input{font-size:14px;padding:7px 12px}
  #page-home,#page-upload,#page-player{padding:14px 10px}
  #video-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .card-title{font-size:13px}
  .card-channel,.card-time{font-size:11px}
  .player-title{font-size:17px}
  .player-meta{flex-direction:column;align-items:flex-start}
  #upload-fab span{display:none}
  #upload-fab{padding:7px 10px}
  #dropzone{padding:32px 16px}
  #dropzone-icon{font-size:36px}
}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--surf2);border-radius:4px}
</style>
</head>
<body>

<div id="demo-banner">
  ⚙️ デモモード（サンプル動画で動作中）—
  <a onclick="document.getElementById('firebase-info').style.display='block'">Firebaseを設定</a>するとアップロード機能が使えます
</div>
<div id="firebase-info" style="display:none;background:#1a1207;border-bottom:1px solid #ff0;padding:12px 16px;font-size:13px;color:#999;">
  firebaseConfigをあなたのプロジェクト情報に変更してください。
  <a href="https://console.firebase.google.com" target="_blank" style="color:#ffdd00">Firebase Console →</a>
  <button onclick="this.parentElement.style.display='none'" style="background:none;border:none;color:#999;cursor:pointer;float:right;font-size:16px">✕</button>
</div>

<header>
  <div class="logo" onclick="goHome()">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.75 15.5v-7l6.25 3.5-6.25 3.5z"/></svg>
    </div>
    <span class="logo-name">View<em>Tube</em></span>
  </div>
  <div class="h-search">
    <input id="search-input" type="text" placeholder="動画を検索">
    <button class="h-search-btn">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </button>
  </div>
  <div class="h-right">
    <button id="upload-fab" onclick="openUploadPage()">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
      <span>投稿</span>
    </button>
    <div id="auth-logged-out">
      <button class="login-btn" onclick="handleLogin()">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
        ログイン
      </button>
    </div>
    <div id="auth-logged-in">
      <div id="header-avatar"></div>
      <span id="header-name"></span>
      <button class="logout-btn" onclick="handleLogout()">ログアウト</button>
    </div>
  </div>
</header>

<div id="page-home">
  <div class="home-header"><h1 class="home-title">おすすめ動画</h1></div>
  <div id="video-grid"></div>
</div>

<div id="page-upload">
  <button class="page-back" onclick="goHome()">
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    戻る
  </button>
  <h2 class="upload-page-title">動画を投稿</h2>
  <div id="dropzone">
    <div id="dropzone-icon">📁</div>
    <div id="dropzone-text">動画ファイルをドラッグ＆ドロップ、またはクリックして選択</div>
    <div class="dropzone-hint">MP4 · MOV · WebM などに対応</div>
  </div>
  <input type="file" id="file-input" accept="video/*" style="display:none">
  <div id="upload-section">
    <div class="upload-fields">
      <div>
        <label class="field-label">タイトル *</label>
        <input class="field-input" id="upload-title" type="text" placeholder="動画のタイトルを入力">
      </div>
      <div>
        <label class="field-label">説明（任意）</label>
        <textarea class="field-input" id="upload-desc" placeholder="動画の説明を入力" rows="3"></textarea>
      </div>
    </div>
    <div class="thumb-section">
      <div class="thumb-section-label">サムネイル（動画から自動生成・クリックで変更）</div>
      <div id="thumb-area">
        <div id="thumb-preview-wrap"><img id="thumb-preview" src="" alt="サムネイル"></div>
        <div class="thumb-area-hint">📷<br>クリックして変更</div>
      </div>
      <input type="file" id="thumb-input" accept="image/*" style="display:none">
    </div>
    <div id="upload-progress-wrap">
      <div class="progress-label">
        <span>アップロード中...</span>
        <span id="upload-progress-pct">0%</span>
      </div>
      <div class="progress-track"><div id="upload-progress-bar"></div></div>
    </div>
    <button id="upload-btn">投稿する</button>
  </div>
</div>

<div id="page-player">
  <button class="page-back" onclick="goHome()">
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    戻る
  </button>
  <div class="player-layout">
    <div class="player-main">
      <div class="player-wrap">
        <video id="main-video" controls playsinline preload="metadata"></video>
      </div>
      <h1 class="player-title" id="player-title"></h1>
      <div class="player-meta">
        <div>
          <div class="player-channel" id="player-channel"></div>
          <div class="player-time" id="player-time"></div>
        </div>
        <div class="player-btns">
          <button class="pill danger" id="player-delete-btn" style="display:none">🗑 削除</button>
        </div>
      </div>
      <div class="player-desc" id="player-desc"></div>
    </div>
    <aside class="related-list-wrap">
      <div class="related-title-hd">次の動画</div>
      <div id="related-list"></div>
    </aside>
  </div>
</div>

<div id="login-modal">
  <div class="login-box">
    <button class="modal-x" onclick="closeLoginModal()">✕</button>
    <div class="login-logo">View<em>Tube</em></div>
    <p class="login-sub">動画を投稿するにはログインが必要です</p>
    <button class="google-btn" onclick="handleLogin()">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
        <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.32-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
        <path fill="#FBBC05" d="M11.68 28.18A13.63 13.63 0 0 1 11 24c0-1.45.25-2.86.68-4.18v-5.7H4.34A23.93 23.93 0 0 0 0 24c0 3.87.93 7.53 2.58 10.77l7.1-5.59z"/>
        <path fill="#EA4335" d="M24 9.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 3.19 29.93 1 24 1 15.4 1 7.96 5.93 4.34 13.23l7.34 5.7C13.42 13.62 18.27 9.75 24 9.75z"/>
      </svg>
      Googleでログイン
    </button>
  </div>
</div>

</body>
</html>
